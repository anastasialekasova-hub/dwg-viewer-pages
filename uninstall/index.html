<body>
  <div class="shell">

    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <b>DWG Viewer</b>
    </div>

    <form id="feedback">
      <div class="q">Why did you remove it?</div>
      <div class="options">
        <label class="opt"><input type="radio" name="reason" value="It couldn't open my DWG or DXF file"><span class="dot"></span>It couldn’t open my DWG or DXF file</label>
        <label class="opt"><input type="radio" name="reason" value="Parts of the drawing were missing or wrong"><span class="dot"></span>Parts of the drawing were missing or wrong</label>
        <label class="opt"><input type="radio" name="reason" value="I expected conversion or editing, not just viewing"><span class="dot"></span>I expected conversion or editing, not just viewing</label>
        <label class="opt"><input type="radio" name="reason" value="Just cleaning up / don't need it anymore"><span class="dot"></span>Just cleaning up / don’t need it anymore</label>
      </div>

      <div class="q q2">Anything else?</div>
      <textarea name="details" placeholder="Optional — what happened, or what you expected…"></textarea>

      <button class="send" type="submit">Send feedback</button>
    </form>

    <div class="thanks">
      <h2>Thank you. Every answer counts.</h2>
      <p>Your answer goes straight to the developer.</p>
    </div>

    <p class="note">Your drawings were never uploaded — they were rendered on your computer, and removing
       the extension deleted its settings. Prefer a conversation?
       <a href="https://github.com/anastasialekasova-hub/dwg-viewer-pages/issues" target="_blank" rel="noopener">Open an issue on GitHub</a>.</p>
  </div>

  var ENTRY_REASON = '';
  var ENTRY_DETAILS = '';

  document.getElementById('feedback').addEventListener('submit', function (e) {
    e.preventDefault();
    var reason = (document.querySelector('input[name="reason"]:checked') || {}).value || '';
    var details = document.querySelector('textarea[name="details"]').value.trim();

    if (FORM_ID && (reason || details)) {
      var data = new FormData();
      if (ENTRY_REASON && reason) data.append(ENTRY_REASON, reason);
      if (ENTRY_DETAILS && details) data.append(ENTRY_DETAILS, details);
      fetch('https://docs.google.com/forms/d/e/' + FORM_ID + '/formResponse',
        { method: 'POST', mode: 'no-cors', body: data }).catch(function () {});
    }
    document.body.dataset.sent = 'true';
  });
</script>
</body>
</html>
